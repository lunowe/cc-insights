[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-insights"
version = "0.1.0"
description = "Local-first tracker and visualizer for coding-agent usage"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cci = "cc_insights.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_insights"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
