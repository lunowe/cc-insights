[build-system]
# 1.27 is the floor for the SPDX `license` string below; older hatchling
# writes Metadata 2.2 and rejects it outright, so the build fails loudly here
# rather than uploading a distribution with no license field.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cc-insights"
version = "0.1.0"
description = "Local-first tracker and visualizer for coding-agent usage"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lunowe" }]
dependencies = []
keywords = [
    "claude-code", "codex", "opencode", "coding-agent", "llm",
    "observability", "time-tracking", "sqlite", "local-first",
]
# Trove classifiers are the only thing PyPI can filter and sort on, so the
# ones that matter are the ones a person would search by: it is a CLI, it
# runs on the three desktop platforms, and it needs 3.11+.
#
# There is deliberately no `License :: OSI Approved :: MIT License` here.
# PEP 639 made license classifiers and the SPDX `license` string above
# mutually exclusive, and build backends reject a project that sets both --
# so adding the one everybody expects breaks the build for the whole repo.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]

# PyPI renders these as the sidebar links, and they are also what the
# trusted-publishing configuration is keyed on: the workflow that uploads
# has to live in the repository named here, or PyPI refuses the OIDC token.
[project.urls]
Homepage = "https://github.com/lunowe/cc-insights"
Repository = "https://github.com/lunowe/cc-insights"
Issues = "https://github.com/lunowe/cc-insights/issues"
Changelog = "https://github.com/lunowe/cc-insights/releases"

# Sync is the only thing that needs a third-party package, and it is the only
# thing you can use the tool for years without touching. Keeping the base
# install dependency-free is a feature, not an accident.
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
# Only for building and checking a release. `test_packaging.py` skips without
# them rather than failing, but then it is not checking anything -- so CI and
# anyone cutting a release installs this.
dev = ["build>=1.2", "hatchling>=1.27", "pytest>=8"]

[project.scripts]
cci = "cc_insights.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_insights"]
# The scheduler templates are package data, not repo scripts: `cci install`
# has to write a launchd job on a machine that has never seen this checkout.
artifacts = ["src/cc_insights/jobs/*"]

# The built dashboard. It lives at `frontend/dist` because that is where Vite
# writes it, and it is gitignored because it is a build artifact -- so without
# this it is in neither the sdist nor the wheel, and a pip-installed `cci
# serve` has no dashboard at all. That was the state of things until now.
#
# Release order therefore matters: build the frontend, THEN build the wheel.
# `test_packaging.py` fails the build rather than shipping half a product.
[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "cc_insights/web"
# Tracked source, unlike the dashboard, but it lives outside the package
# directory -- and without it `cci init` builds a database with no tables.
"migrations" = "cc_insights/migrations"

# The sdist carries the whole repo including `migrations/`, so a build from
# it works. `frontend/dist` is the exception: it is gitignored, so `pip
# install` from an sdist yields the JSON API with no dashboard. Acceptable --
# the wheel is the supported path and that is what PyPI serves.
[tool.hatch.build.targets.sdist]
include = ["src", "migrations", "scripts", "frontend", "docs", "tests",
           "README.md", "PROMPT.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
